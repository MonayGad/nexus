<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Announcement comments</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page" style="padding-bottom: 110px; gap: 14px">
<div class="row">
<a class="ib" href="Announcements.dc.html" aria-label="Back to announcements"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span class="t grow">Comments ({{count}})</span>
</div>
<div class="glass col" style="border-radius: 22px; padding: 14px; gap: 6px">
<span class="chip c-maroon" style="align-self: flex-start"><svg class="ic s14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"></path></svg>Pinned</span>
<span class="t">Midterm room changes</span>
<span class="cap">Dr. Hany Fawzy • Oct 24, 2026 • 9:30 AM</span>
</div>
<div class="col gap14">
<sc-for list="{{comments}}" as="c" hint-placeholder-count="3">
<div class="row pop" style="align-items: flex-start; gap: 10px">
<span class="{{c.av}}">{{c.i}}</span>
<div class="col grow" style="gap: 6px; padding: 12px 14px; border-radius: 6px 20px 20px 20px; background: {{c.bg}}; border: 1px solid rgba(255,255,255,.9)">
<div class="row gap6"><span class="ts">{{c.name}}</span><span class="{{c.roleCls}}">{{c.role}}</span><span class="grow"></span><span class="cap">{{c.time}}</span></div>
<span class="body" style="font-size: 13px">{{c.text}}</span>
<sc-if value="{{c.mine}}" hint-placeholder-val="{{ false }}"><div class="row" style="gap: 14px"><button class="link" style="border: none; background: none; padding: 4px 0; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer">Edit</button><button onClick="{{c.del}}" style="border: none; background: none; padding: 4px 0; font: inherit; font-size: 12px; font-weight: 700; color: #B3261E; cursor: pointer">Delete</button></div></sc-if>
</div>
</div>
</sc-for>
</div>
</div>
<div class="row" style="position: absolute; left: 12px; right: 12px; bottom: 24px; gap: 8px; padding: 8px 8px 8px 16px; border-radius: 26px; border: 1px solid rgba(255,255,255,.85); background: rgba(255,255,255,.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 10px 30px rgba(27,29,34,.08)">
<label class="sr" for="ac">Add a comment</label>
<input id="ac" placeholder="Add a comment" value="{{draft}}" onChange="{{onDraft}}" style="flex: 1; min-width: 0; height: 44px; border: none; outline: none; background: transparent; font: inherit; font-size: 15px">
<button class="ib ib-brand" aria-label="Send comment" onClick="{{onSend}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4Z"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '', list: [
      { id: 1, i: 'OM', tone: 'c-blue', name: 'Omar K.', role: 'Member', time: '3h ago', text: 'Is the lab session also in B204?', mine: false },
      { id: 2, i: 'HF', tone: 'c-blue', name: 'Dr. Hany', role: 'Staff', time: '2h ago', text: 'Yes, both lecture and lab are in B204 on Thursday.', mine: false },
      { id: 3, i: 'MG', tone: 'c-maroon', name: 'You', role: 'Member', time: '12m ago', text: 'Thanks for the map, super helpful.', mine: true }
    ] };
  }
  renderVals() {
    const list = this.state.list;
    return {
      motion: ((this.props.motion ?? true) ? '' : 'still') + (this.props.dark || (() => { try { return localStorage.getItem('nexus-theme') === 'dark'; } catch (e) { return false; } })() ? ' dark' : ''),
      count: list.length,
      draft: this.state.draft,
      comments: list.map((c) => ({ ...c, av: 'av ' + c.tone, bg: c.mine ? '#F6DCDF' : 'rgba(255,255,255,.75)', roleCls: c.role === 'Staff' ? 'chip c-solid' : 'chip c-neutral', del: () => this.setState({ list: this.state.list.filter((x) => x.id !== c.id) }) })),
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onSend: () => { const t = this.state.draft.trim(); if (!t) return; this.setState({ draft: '', list: list.concat([{ id: Date.now(), i: 'MG', tone: 'c-maroon', name: 'You', role: 'Member', time: 'Just now', text: t, mine: true }]) }); }
    };
  }
}
</script>
</body>
</html>

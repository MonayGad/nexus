<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm account restore</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page" style="gap: 22px">
<a class="ib rise" href="RestoreAccount.dc.html" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>

<div class="col gap10 rise d2">
<h1 class="big">Confirm account<br><span style="color: #7A1426">restore.</span></h1>
<p class="body">Enter the 6-digit verification code we sent to</p>
<span class="glass row" style="align-self: flex-start; gap: 8px; padding: 8px 12px; border-radius: 12px"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true" style="color: #7A1426"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m3 7 9 6 9-6"></path></svg><span class="ts">monay.g@university.edu</span></span>
</div>

<div class="glass rise d3" style="border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<label class="over" for="rcode">Verification code</label>
<div style="position: relative">
<div class="otp" aria-hidden="true">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="6"><span class="{{b.cls}}">{{b.d}}</span></sc-for>
</div>
<input id="rcode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" value="{{code}}" onChange="{{onCode}}" style="position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px">
</div>
<sc-if value="{{showError}}" hint-placeholder-val="{{ false }}"><span class="err-t">Please enter the 6-digit verification code.</span></sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div class="status pop" style="background: #E3F1EA; color: #2F6B4F"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>Account restored successfully.</div>
<a class="btn btn-primary btn-block" href="Home.dc.html">Go to home<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</sc-if>
<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<button class="btn btn-primary btn-block" onClick="{{onConfirm}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"></path><path d="M21 3v5h-5"></path></svg>Confirm restore</button>
</sc-if>
</div>

<div class="row center rise d4" style="gap: 8px">
<sc-if value="{{waiting}}" hint-placeholder-val="{{ true }}"><span class="small" style="font-weight: 700">Resend code in {{timer}}</span></sc-if>
<sc-if value="{{canResend}}" hint-placeholder-val="{{ false }}"><span class="small">Didn’t get it?</span><button class="link" onClick="{{onResend}}" style="border: none; background: none; font: inherit; font-weight: 700; cursor: pointer; padding: 10px 0">Resend code</button></sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { code: '71903', tried: false, done: false, seconds: 0 }; }
  componentDidMount() { this.timer = setInterval(() => { if (this.state.seconds > 0) this.setState({ seconds: this.state.seconds - 1 }); }, 1000); }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const code = this.state.code;
    const s = this.state.seconds;
    return {
      motion: ((this.props.motion ?? true) ? '' : 'still') + (this.props.dark || (() => { try { return localStorage.getItem('nexus-theme') === 'dark'; } catch (e) { return false; } })() ? ' dark' : ''),
      code: code,
      boxes: [0, 1, 2, 3, 4, 5].map((i) => ({ d: code[i] || '', cls: i < code.length ? '' : (i === code.length ? 'cur' : 'e') })),
      showError: this.state.tried && code.length !== 6,
      done: this.state.done,
      notDone: !this.state.done,
      waiting: s > 0,
      canResend: s === 0,
      timer: '00:' + String(s).padStart(2, '0'),
      onCode: (e) => this.setState({ code: e.target.value.replace(/[^0-9]/g, '').slice(0, 6), done: false }),
      onConfirm: () => (code.length === 6 ? this.setState({ done: true }) : this.setState({ tried: true })),
      onResend: () => this.setState({ seconds: 60 })
    };
  }
}
</script>
</body>
</html>

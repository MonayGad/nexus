<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add chat member</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page" aria-hidden="true"><div class="col center" style="gap: 10px"><div class="av c-blue" style="width: 96px; height: 96px"></div></div><div class="glass" style="height: 200px; border-radius: 24px"></div></div>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-label="Add member" style="min-height: 520px">
<div class="handle" aria-hidden="true"></div>
<div class="row"><h2 class="h1 grow">Add member</h2><a class="ib" href="ConversationInfo.dc.html" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div>
<label class="input focus"><span class="sr">Search by username or email</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input placeholder="Search by username or email" value="{{q}}" onChange="{{onQ}}"><sc-if value="{{hasQ}}" hint-placeholder-val="{{ true }}"><button aria-label="Clear search" onClick="{{clear}}" style="border: none; background: none; padding: 6px; cursor: pointer; color: #4B5563; display: flex"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if></label>
<sc-if value="{{tooShort}}" hint-placeholder-val="{{ false }}"><span class="small">Type at least 2 characters of a username or email.</span></sc-if>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="status pop" style="background: #E3F1EA; color: #2F6B4F">{{toast}}</div></sc-if>
<div class="col gap8">
<sc-for list="{{results}}" as="u" hint-placeholder-count="3">
<div class="file pop"><span class="{{u.av}}">{{u.i}}</span><span class="col grow"><span class="ts">{{u.name}}</span><span class="cap">{{u.handle}}</span></span>
<sc-if value="{{u.member}}" hint-placeholder-val="{{ false }}"><span class="chip c-neutral">Already a member</span></sc-if>
<sc-if value="{{u.canAdd}}" hint-placeholder-val="{{ true }}"><button class="btn btn-soft btn-sm" onClick="{{u.ask}}"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c1-4 3.5-6 7-6s6 2 7 6"></path><path d="M19 8v6M16 11h6"></path></svg>Add</button></sc-if>
</div>
</sc-for>
</div>
<sc-if value="{{none}}" hint-placeholder-val="{{ false }}">
<div class="col center" style="gap: 8px; padding: 10px"><span class="tile tile-l c-blue"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span><span class="t">No users found for “{{q}}”</span><span class="small">They may not have an account yet, or may hide themselves from search.</span></div>
</sc-if>
</div>
<sc-if value="{{confirm}}" hint-placeholder-val="{{ false }}">
<div class="scrim" style="z-index: 10"></div>
<div class="dialog" role="alertdialog" aria-label="Add member?" style="z-index: 11">
<div>
<span class="tile tile-l bg-blue"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c1-4 3.5-6 7-6s6 2 7 6"></path><path d="M19 8v6M16 11h6"></path></svg></span>
<h2 class="h2">Add member?</h2>
<p class="body" style="font-size: 13px">Add {{confirmName}} to this group?</p>
<div class="row" style="gap: 10px; width: 100%"><button class="btn btn-soft grow" onClick="{{cancel}}">Cancel</button><button class="btn btn-primary grow" onClick="{{doAdd}}">Add</button></div>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: 'la', ask: null, added: [], toast: '' }; }
  renderVals() {
    const U = [
      { id: 1, i: 'LH', tone: 'c-coral', name: 'Laila Hassan', handle: '@laila.h · laila.h@university.edu', member: true },
      { id: 2, i: 'LA', tone: 'c-amber', name: 'Lama Ahmed', handle: '@lama · lama.a@university.edu', member: false },
      { id: 3, i: 'KL', tone: 'c-blue', name: 'Karim Labib', handle: '@klabib · k.labib@university.edu', member: false }
    ];
    const q = this.state.q.trim().toLowerCase();
    const short = q.length > 0 && q.length < 2;
    const res = q.length >= 2 ? U.filter((u) => (u.name + u.handle).toLowerCase().includes(q)) : [];
    const ask = U.find((u) => u.id === this.state.ask);
    return {
      motion: (this.props.motion ?? true) ? '' : 'still',
      q: this.state.q,
      hasQ: this.state.q.length > 0,
      tooShort: short,
      none: q.length >= 2 && res.length === 0,
      hasToast: !!this.state.toast,
      toast: this.state.toast,
      results: res.map((u) => { const m = u.member || this.state.added.includes(u.id); return { ...u, av: 'av ' + u.tone, member: m, canAdd: !m, ask: () => this.setState({ ask: u.id }) }; }),
      confirm: !!ask,
      confirmName: ask ? ask.name : '',
      cancel: () => this.setState({ ask: null }),
      doAdd: () => this.setState({ ask: null, added: this.state.added.concat([ask.id]), toast: ask.name + ' added.' }),
      onQ: (e) => this.setState({ q: e.target.value, toast: '' }),
      clear: () => this.setState({ q: '', toast: '' })
    };
  }
}
</script>
</body>
</html>

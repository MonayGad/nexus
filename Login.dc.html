<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nexus login</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page" style="gap: 22px; padding-top: 60px">

<div class="row rise" style="gap: 10px">
<div class="tile" style="width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; box-shadow: 0 10px 24px rgba(122,20,38,.18)"><img src="logo-mark.png" alt="Nexus logo" style="width: 34px; height: 34px; object-fit: contain"></div>
<div class="col"><span class="t">Nexus</span><span class="cap">Academic System</span></div>
</div>

<div class="hero rise d2" style="display: flex; flex-direction: column; gap: 14px">
<div class="sheen" aria-hidden="true"></div>
<div class="row gap6">
<span class="chip c-hero"><svg class="ic s14" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5Z"></path><path d="M6 12v5c3 2 9 2 12 0v-5"></path></svg>Classes</span>
<span class="chip c-hero"><svg class="ic s14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>Tasks</span>
<span class="chip c-hero"><svg class="ic s14" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg>Chat</span>
</div>
<p class="h1" style="color: #FFFFFF">Everything for your semester, in one place.</p>
<div class="row gap6" aria-hidden="true"><span style="width: 90px; height: 6px; border-radius: 3px; background: #FF7A59"></span><span style="width: 60px; height: 6px; border-radius: 3px; background: #F2A93B"></span><span style="width: 40px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.35)"></span></div>
</div>

<div class="col gap8 rise d3">
<h1 class="big">Welcome<br><span style="color: #7A1426">back.</span></h1>
<p class="body">Sign in with your university credentials</p>
</div>

<div class="glass card rise d4" style="border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div class="field">
<label class="over" for="email">University email</label>
<div class="{{inputClass}}">
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m3 7 9 6 9-6"></path></svg>
<input id="email" type="email" placeholder="student@university.edu" value="{{email}}" onChange="{{onEmail}}">
</div>
<sc-if value="{{showError}}" hint-placeholder-val="{{ false }}"><span class="err-t">Please enter your email.</span></sc-if>
</div>
<sc-if value="{{valid}}" hint-placeholder-val="{{ false }}">
<a class="btn btn-primary btn-block" href="VerifyEmail.dc.html">Continue<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</sc-if>
<sc-if value="{{invalid}}" hint-placeholder-val="{{ true }}">
<button class="btn btn-primary btn-block" onClick="{{onContinue}}">Continue<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</sc-if>
</div>

<div class="row center rise d5" style="gap: 6px">
<span class="small">Deactivated by mistake?</span>
<a class="link" href="RestoreAccount.dc.html">Restore my account</a>
</div>
</div>

<div class="row center" style="position: absolute; left: 0; right: 0; bottom: 30px; gap: 14px">
<svg class="ic s14" viewBox="0 0 24 24" aria-hidden="true" style="color: #4B5563"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>
<a class="cap" href="#help" style="text-decoration: none">Help &amp; Support</a>
<span class="cap" aria-hidden="true">·</span>
<a class="cap" href="#privacy" style="text-decoration: none">Privacy Policy</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { email: '', tried: false }; }
  renderVals() {
    const email = this.state.email;
    const valid = email.trim().length > 0;
    const showError = this.state.tried && !valid;
    return {
      motion: (this.props.motion ?? true) ? '' : 'still',
      email: email,
      valid: valid,
      invalid: !valid,
      showError: showError,
      inputClass: showError ? 'input err' : 'input',
      onEmail: (e) => this.setState({ email: e.target.value }),
      onContinue: () => this.setState({ tried: true })
    };
  }
}
</script>
</body>
</html>

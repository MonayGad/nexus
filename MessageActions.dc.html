<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Message actions</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl5"></div></div>
<div class="col" style="position: absolute; top: 120px; left: 14px; right: 14px; gap: 10px; filter: blur(3px); opacity: .6" aria-hidden="true">
<div class="b-them bubble" style="align-self: flex-start; width: 220px">Who’s taking module 5?</div>
<div class="b-them bubble" style="align-self: flex-start; width: 180px">Notes are in files.</div>
</div>
<div class="scrim"></div>

<div class="col pop" style="position: absolute; top: 230px; right: 16px; z-index: 9; align-items: flex-end; gap: 10px; width: 300px">
<div class="b-me bubble">I’ll take module 5 and draft the practice set tonight.</div>
<span class="meta row gap4" style="font-size: 11px; font-weight: 700; color: #B3261E"><svg class="ic s14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>Not sent</span>
<div class="menu" style="position: static">
<a href="Conversation.dc.html" style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 14px; color: #1B1D22; font-size: 14px; font-weight: 600; text-decoration: none"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 5 5v6"></path></svg>Reply</a>
<button><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="3"></rect><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path></svg>Copy</button>
<button><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"></path><path d="M21 3v5h-5"></path></svg>Retry send</button>
<button onClick="{{open}}" style="color: #B3261E"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"></path></svg>Delete message</button>
</div>
</div>

<sc-if value="{{sheet}}" hint-placeholder-val="{{ true }}">
<div class="sheet" role="dialog" aria-label="Delete message" style="z-index: 12">
<div class="handle" aria-hidden="true"></div>
<h2 class="h1">Delete message?</h2>
<button class="actrow danger" onClick="{{close}}"><span class="tile c-danger"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"></path></svg></span><span class="col grow"><span class="ts" style="color: #B3261E">Delete for everyone</span><span class="cap">Removes this message for all participants, subject to your permissions in this chat.</span></span></button>
<button class="actrow" onClick="{{close}}"><span class="tile c-blue"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2l20 20M10.6 6.1A10 10 0 0 1 22 12a17 17 0 0 1-3 3.6M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"></path></svg></span><span class="col grow"><span class="ts">Delete for me</span><span class="cap">Removes it from your chat history on this device only. Other participants still see it.</span></span></button>
<button class="btn btn-soft btn-block" onClick="{{close}}">Cancel</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sheet: true }; }
  renderVals() {
    return {
      motion: (this.props.motion ?? true) ? '' : 'still',
      sheet: this.state.sheet,
      open: () => this.setState({ sheet: true }),
      close: () => this.setState({ sheet: false })
    };
  }
}
</script>
</body>
</html>

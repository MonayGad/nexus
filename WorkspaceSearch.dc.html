<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search workspaces</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page">
<div class="row" style="gap: 10px">
<a class="ib" href="Workspaces.dc.html" aria-label="Back to workspaces"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<label class="input focus grow" style="height: 50px">
<span class="sr">Search workspaces</span>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input type="search" placeholder="Search by workspace name or instructor" value="{{q}}" onChange="{{onQ}}">
<sc-if value="{{hasQ}}" hint-placeholder-val="{{ true }}"><button aria-label="Clear search" onClick="{{onClear}}" style="border: none; background: none; padding: 6px; cursor: pointer; color: #4B5563; display: flex"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
</label>
</div>

<sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
<span class="over">{{count}}</span>
<div class="col gap10">
<sc-for list="{{results}}" as="w" hint-placeholder-count="2">
<a class="glass lift row pop" href="WorkspaceOverview.dc.html" style="border-radius: 24px; padding: 14px; gap: 14px; text-decoration: none; color: #1B1D22">
<span class="tile" style="background: {{w.tone}}; width: 56px; height: 56px; border-radius: 18px; font-weight: 800; font-size: 17px">{{w.code}}</span>
<span class="col grow gap4"><span class="t">{{w.title}}</span><span class="cap">{{w.who}}</span></span>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #4B5563"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</sc-for>
</div>
</sc-if>

<sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
<div class="glass col center pop" style="border-radius: 28px; padding: 26px; gap: 10px">
<div class="tile tile-l c-blue"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></div>
<span class="t">No workspaces found for “{{q}}”</span>
<span class="small">Try a course name or your instructor’s name.</span>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: 'data' }; }
  renderVals() {
    const all = [
      { code: 'ML', title: 'Machine Learning', who: 'Dr. Salma Adel · Computer Science', tone: '#E0466A' },
      { code: 'DS', title: 'Data Science Lab', who: 'Dr. Hany Fawzy · AID 427', tone: '#5B8DEF' },
      { code: 'UX', title: 'Design Studio', who: 'Prof. Laila Hassan · Fine Arts', tone: '#FF7A59' },
      { code: 'BD', title: 'Big Data Systems', who: 'Dr. Omar Kamal · Information Systems', tone: '#F2A93B' },
      { code: 'C+', title: 'Algorithms & C++', who: 'Dr. Youssef Mahmoud · Computer Science', tone: '#4F6D8F' }
    ];
    const q = this.state.q.trim().toLowerCase();
    const results = q ? all.filter((w) => (w.title + ' ' + w.who).toLowerCase().includes(q)) : all;
    return {
      motion: ((this.props.motion ?? true) ? '' : 'still') + (this.props.dark || (() => { try { return localStorage.getItem('nexus-theme') === 'dark'; } catch (e) { return false; } })() ? ' dark' : ''),
      q: this.state.q,
      hasQ: this.state.q.length > 0,
      results: results,
      count: results.length + (results.length === 1 ? ' result' : ' results'),
      hasResults: results.length > 0,
      noResults: results.length === 0,
      onQ: (e) => this.setState({ q: e.target.value }),
      onClear: () => this.setState({ q: '' })
    };
  }
}
</script>
</body>
</html>

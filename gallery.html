<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · All screens</title><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--maroon:#7A1426;--ink:#1B1D22;--ink-2:#4B5563;--ground:#EEF0F5}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.b1{width:420px;height:420px;background:#7A1426;opacity:.35;top:-120px;right:-120px}
.b2{width:360px;height:360px;background:#FF7A59;opacity:.35;top:40%;left:-140px}
.b3{width:380px;height:380px;background:#5B8DEF;opacity:.3;bottom:-120px;right:10%}
header{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:56px 16px 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800}
.logo span{width:40px;height:40px;border-radius:13px;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(122,20,38,.35)}
h1{font-size:clamp(34px,6vw,56px);letter-spacing:-.03em;line-height:1.05;margin:20px 0 10px}
h1 em{font-style:normal;color:var(--maroon)}
p.lead{max-width:620px;color:var(--ink-2);font-size:16px;line-height:1.6;margin:0}
nav{position:sticky;top:0;z-index:5;background:rgba(238,240,245,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.8)}
nav div{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto}
nav a{flex-shrink:0;padding:9px 14px;border-radius:14px;background:rgba(255,255,255,.7);color:var(--ink);text-decoration:none;font-weight:700;font-size:13px;white-space:nowrap}
nav a:hover{background:var(--maroon);color:#fff}
section{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:40px 16px 8px}
h2{font-size:26px;letter-spacing:-.02em;margin:0 0 20px}
.grid{display:flex;flex-wrap:wrap;gap:28px}
figure{margin:0;display:flex;flex-direction:column;gap:10px}
.phone{width:302px;border-radius:40px;padding:6px;background:#1B1D22;box-shadow:0 30px 60px rgba(27,29,34,.18)}
.screen{width:290px;height:627px;border-radius:34px;overflow:hidden;position:relative;background:var(--ground)}
.screen iframe{position:absolute;top:0;left:0;width:390px;height:844px;border:0;transform:scale(.7436);transform-origin:0 0}
figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:0 6px}
figcaption a{font-size:12px;color:var(--maroon);text-decoration:none;font-weight:800}
footer{position:relative;z-index:1;text-align:center;color:var(--ink-2);font-size:13px;padding:48px 16px}
@media (max-width:420px){.grid{justify-content:center}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<header>
<div class="logo"><span>N</span>Nexus Academic System</div>
<h1>The student app,<br><em>redesigned.</em></h1>
<p style="margin:0 0 18px"><a href="index.html" style="display:inline-flex;align-items:center;height:46px;padding:0 20px;border-radius:16px;background:#7A1426;color:#fff;font-weight:700;text-decoration:none;box-shadow:0 10px 24px rgba(122,20,38,.3)">Open as app ↗</a></p><p class="lead">Every screen of Nexus, rebuilt with a glassy maroon look. Each phone is live: tap through flows, switch tabs, type into fields. Open any screen full size to see the motion.</p>
</header>
<nav aria-label="Flows"><div id="nav"></div></nav>
<main id="main"></main>
<footer>Nexus · UI redesign preview</footer>
<script>

"p": "profile"}, {"f": "Deactivate.dc.html", "t": "Deactivate account dialog", "h": 844, "p": "profile"}]}
;
const nav = document.getElementById('nav'), main = document.getElementById('main');
for (const p of M.pages) {
  const a = document.createElement('a'); a.href = '#' + p.id; a.textContent = p.name.replace(/^\d+ · /, ''); nav.appendChild(a);
  const s = document.createElement('section'); s.id = p.id;
  const h = document.createElement('h2'); h.textContent = p.name.replace(/^\d+ · /, ''); s.appendChild(h);
  const g = document.createElement('div'); g.className = 'grid'; s.appendChild(g);
  for (const b of M.boards.filter(x => x.p === p.id)) {
    const f = document.createElement('figure');
    const ph = document.createElement('div'); ph.className = 'phone';
    const sc = document.createElement('div'); sc.className = 'screen';
    const fr = document.createElement('iframe'); fr.loading = 'lazy'; fr.title = b.t; fr.src = b.f;
    sc.appendChild(fr); ph.appendChild(sc); f.appendChild(ph);
    const c = document.createElement('figcaption');
    const t = document.createElement('span'); t.textContent = b.t;
    const o = document.createElement('a'); o.href = b.f; o.target = '_blank'; o.rel = 'noopener'; o.textContent = 'Open ↗';
    c.appendChild(t); c.appendChild(o); f.appendChild(c); g.appendChild(f);
  }
  main.appendChild(s);
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search in conversation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
.hit{outline:3px solid #F2A93B;outline-offset:3px;transition:outline-color .3s ease}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl5"></div></div>
<header class="col" style="position: absolute; top: 0; left: 0; right: 0; z-index: 3; padding: 50px 14px 12px; gap: 10px; background: rgba(255,255,255,.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,.85)">
<div class="row" style="gap: 8px">
<a class="ib ib-sm" href="Conversation.dc.html" aria-label="Close search" style="background: transparent; border: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<label class="input focus grow" style="height: 46px"><span class="sr">Search in this conversation</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input placeholder="Type to search messages" value="{{q}}" onChange="{{onQ}}"></label>
</div>
<div class="row" style="gap: 8px">
<span class="small grow" style="font-weight: 700">{{status}}</span>
<button class="ib ib-sm" aria-label="Previous match" onClick="{{prev}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
<button class="ib ib-sm" aria-label="Next match" onClick="{{next}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</header>
<div class="col" style="position: absolute; top: 160px; bottom: 30px; left: 0; right: 0; padding: 0 14px; gap: 10px; justify-content: flex-end; overflow: hidden">
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="6">
<div class="col" style="align-self: {{m.align}}; align-items: {{m.align}}; max-width: 82%; gap: 4px; opacity: {{m.op}}">
<span class="cap" style="font-weight: 800; color: #7A1426">{{m.who}}</span>
<div class="{{m.cls}}">{{m.text}}</div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: 'module', idx: 1 }; }
  renderVals() {
    const M = [
      { who: 'Salma', text: 'Who’s taking module 5 and 6 for the study guide?', me: false },
      { who: 'Omar', text: 'Module 5 notes are in the files tab.', me: false },
      { who: 'You', text: 'I’ll take module 5 and draft the practice set tonight.', me: true },
      { who: 'Laila', text: 'Then I’ll do module 6 and the summary table.', me: false },
      { who: 'Youssef', text: 'Can we meet Saturday at the library?', me: false },
      { who: 'You', text: 'Works for me, see you at 2!', me: true }
    ];
    const q = this.state.q.trim().toLowerCase();
    const hits = q ? M.map((m, i) => (m.text.toLowerCase().includes(q) ? i : -1)).filter((i) => i >= 0) : [];
    const n = hits.length;
    const idx = n ? Math.min(this.state.idx, n - 1) : 0;
    const cur = n ? hits[idx] : -1;
    return {
      motion: ((this.props.motion ?? true) ? '' : 'still') + (this.props.dark || (() => { try { return localStorage.getItem('nexus-theme') === 'dark'; } catch (e) { return false; } })() ? ' dark' : ''),
      q: this.state.q,
      status: !q ? 'Type to search messages' : (n ? (idx + 1) + ' of ' + n + ' matches' : 'No matching messages'),
      msgs: M.map((m, i) => ({ who: m.who, text: m.text, align: m.me ? 'flex-end' : 'flex-start', op: !q || hits.includes(i) ? 1 : 0.45, cls: (m.me ? 'bubble b-me' : 'bubble b-them') + (i === cur ? ' hit' : '') })),
      onQ: (e) => this.setState({ q: e.target.value, idx: 0 }),
      prev: () => this.setState({ idx: n ? (idx - 1 + n) % n : 0 }),
      next: () => this.setState({ idx: n ? (idx + 1) % n : 0 })
    };
  }
}
</script>
</body>
</html>

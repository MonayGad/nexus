<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deactivate account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page" aria-hidden="true">
<div class="col center" style="gap: 10px; padding-top: 30px"><div class="av c-maroon" style="width: 112px; height: 112px; font-size: 34px">NR</div></div>
<div class="glass" style="height: 300px; border-radius: 26px"></div>
</div>
<div class="scrim"></div>
<div class="dialog" role="alertdialog" aria-label="Deactivate account">
<div>
<span class="tile tile-l bg-amber"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m5.6 5.6 12.8 12.8"></path></svg></span>
<h2 class="h2">Deactivate account</h2>
<p class="body" style="font-size: 13px">Are you sure you want to deactivate your account? You can restore it later by logging in again.</p>
<sc-if value="{{busy}}" hint-placeholder-val="{{ false }}"><span class="small" style="font-weight: 700">Deactivating...</span></sc-if>
<div class="row" style="gap: 10px; width: 100%"><a class="btn btn-soft grow" href="EditProfile.dc.html">Cancel</a><button class="btn btn-danger grow" onClick="{{go}}">Deactivate</button></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { busy: false }; }
  renderVals() {
    return {
      motion: (this.props.motion ?? true) ? '' : 'still',
      busy: this.state.busy,
      go: () => this.setState({ busy: true })
    };
  }
}
</script>
</body>
</html>

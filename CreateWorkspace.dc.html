<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create workspace</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page" aria-hidden="true">
<h1 class="display">Workspaces</h1>
<div class="glass" style="height: 50px; border-radius: 18px"></div>
<div class="glass" style="height: 88px; border-radius: 24px"></div>
<div class="glass" style="height: 88px; border-radius: 24px"></div>
</div>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-label="Create workspace">
<div class="handle" aria-hidden="true"></div>
<div class="row">
<div class="col grow gap4"><h2 class="h1">Create workspace</h2><span class="small">A space for your course, club, or study group.</span></div>
<a class="ib" href="Workspaces.dc.html" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
</div>

<sc-if value="{{created}}" hint-placeholder-val="{{ false }}">
<div class="status pop" style="background: #E3F1EA; color: #2F6B4F"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>Workspace created.</div>
</sc-if>

<div class="field">
<label class="over" for="wsname">Workspace name</label>
<div class="{{nameClass}}"><input id="wsname" placeholder="e.g. Advanced Physics 101" value="{{name}}" onChange="{{onName}}"></div>
<sc-if value="{{nameError}}" hint-placeholder-val="{{ false }}"><span class="err-t">Give your workspace a name.</span></sc-if>
</div>
<div class="field">
<label class="over" for="wsdesc">Description</label>
<textarea id="wsdesc" class="area" placeholder="What is this workspace for?" style="min-height: 92px"></textarea>
</div>
<div class="field">
<span class="over">Cover image</span>
<sc-if value="{{noCover}}" hint-placeholder-val="{{ true }}">
<button class="dash col center" onClick="{{onCover}}" style="height: 112px; gap: 8px; cursor: pointer; font: inherit; width: 100%">
<span class="tile bg-soft"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"></path></svg></span>
<span class="ts" style="color: #7A1426">Tap to upload cover</span>
</button>
</sc-if>
<sc-if value="{{hasCover}}" hint-placeholder-val="{{ false }}">
<button class="col center pop" onClick="{{onCover}}" style="height: 112px; border: none; border-radius: 20px; background: linear-gradient(135deg,#FF7A59,#E0466A 55%,#7A1426); cursor: pointer; font: inherit; width: 100%">
<span class="chip c-neutral"><svg class="ic s14" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-5-5L5 21"></path></svg>cover.jpg · Tap to change</span>
</button>
</sc-if>
</div>
<button class="btn btn-primary btn-block" onClick="{{onCreate}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Create workspace</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { name: 'Advanced Physics 101', cover: false, tried: false, created: false }; }
  renderVals() {
    const ok = this.state.name.trim().length > 0;
    const err = this.state.tried && !ok;
    return {
      motion: ((this.props.motion ?? true) ? '' : 'still') + (this.props.dark || (() => { try { return localStorage.getItem('nexus-theme') === 'dark'; } catch (e) { return false; } })() ? ' dark' : ''),
      name: this.state.name,
      nameClass: err ? 'input err' : 'input focus',
      nameError: err,
      noCover: !this.state.cover,
      hasCover: this.state.cover,
      created: this.state.created,
      onName: (e) => this.setState({ name: e.target.value, created: false }),
      onCover: () => this.setState({ cover: !this.state.cover }),
      onCreate: () => this.setState({ tried: true, created: ok })
    };
  }
}
</script>
</body>
</html>

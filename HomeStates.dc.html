<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page">
<div class="row">
<div class="av c-maroon" style="width: 52px; height: 52px">NR</div>
<div class="col grow"><h1 class="h1">Hello, Nour</h1><span class="small">Ready to excel today?</span></div>
<button class="ib" aria-label="Notifications"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>
</div>

<sc-if value="{{isError}}" hint-placeholder-val="{{ true }}">
<div class="glass-hi col center pop" style="border-radius: 28px; padding: 24px; gap: 12px">
<div class="tile tile-xl bg-soft" style="animation: wiggle 2.4s ease-in-out infinite"><svg class="ic s28" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 2l20 20M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.8M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 10.7 5M12 20h.01"></path></svg></div>
<h2 class="h2">Something went wrong.</h2>
<p class="body" style="font-size: 13px">Please try again. We keep your last data cached while you’re offline.</p>
<button class="btn btn-primary btn-sm" onClick="{{onRetry}}"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"></path><path d="M21 3v5h-5"></path></svg>Retry</button>
</div>
</sc-if>

<sc-if value="{{isLoading}}" hint-placeholder-val="{{ false }}">
<div class="col gap10" aria-label="Loading" role="status">
<div class="skel" style="height: 150px; border-radius: 28px"></div>
<div class="row" style="gap: 12px"><div class="skel grow" style="height: 110px; border-radius: 24px"></div><div class="skel grow" style="height: 110px; border-radius: 24px"></div></div>
<div class="skel" style="height: 14px; width: 60%"></div>
<div class="skel" style="height: 86px; border-radius: 24px"></div>
</div>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ true }}">
<div class="col gap10 rise">
<div class="row between"><h2 class="h2">Upcoming deadlines</h2><a class="link" href="Tasks.dc.html">View all</a></div>
<div class="glass row" style="border-radius: 24px; padding: 18px; gap: 14px"><span class="tile bg-mint"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg></span><span class="ts grow">No upcoming deadlines. You’re all caught up!</span></div>
</div>
<div class="col gap10 rise d2">
<h2 class="h2">Announcements</h2>
<div class="glass row" style="border-radius: 24px; padding: 18px; gap: 14px"><span class="tile c-blue"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"></path><path d="M15 9a4 4 0 0 1 0 6"></path></svg></span><span class="ts grow">No new announcements right now.</span></div>
</div>
</sc-if>
</div>

<nav class="nav" aria-label="Main">
<a class="on" href="Home.dc.html"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path></svg>Home</a>
<a href="Workspaces.dc.html" aria-label="Workspaces"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7z"></path><path d="m2 12 10 5 10-5"></path><path d="m2 17 10 5 10-5"></path></svg></a>
<a href="Chats.dc.html" aria-label="Chats"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"view":{"editor":"enum","options":["error","loading","empty"],"default":"error"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { view: null }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const v = this.state.view || this.props.view || 'error';
    return {
      motion: (this.props.motion ?? true) ? '' : 'still',
      isError: v === 'error',
      isLoading: v === 'loading',
      isEmpty: v === 'error' || v === 'empty',
      onRetry: () => { this.setState({ view: 'loading' }); this.t = setTimeout(() => this.setState({ view: 'empty' }), 1400); }
    };
  }
}
</script>
</body>
</html>

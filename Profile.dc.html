<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 900px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page" style="padding-bottom: 40px">
<div class="row rise">
<a class="ib" href="Home.dc.html" aria-label="Back to home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span class="t grow">Profile</span>
</div>

<div class="col center rise d2" style="gap: 10px; padding-top: 6px">
<div class="ringwrap" style="width: 112px; height: 112px"><div class="ring" aria-hidden="true"></div><span class="av c-maroon" style="font-size: 34px">MG</span></div>
<h1 class="display">Monay Gad</h1>
<span class="chip c-maroon">@monay.g</span>
<p class="body" style="text-align: center; max-width: 300px">Data science student. Building agents, sketching interfaces, collecting good coffee.</p>
<a class="btn btn-primary" href="EditProfile.dc.html" style="padding: 0 26px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>Edit profile</a>
</div>

<div class="glass row rise d3" style="border-radius: 24px; padding: 16px 8px; justify-content: space-around">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<div class="col center" style="gap: 2px; min-width: 70px"><span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">{{s.v}}</span><span class="cap">{{s.l}}</span></div>
</sc-for>
</div>

<div class="col gap10 rise d4">
<div class="actrow"><span class="tile c-maroon"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg></span><span class="col grow"><span class="ts">Dark mode</span><span class="cap">Applies to every screen</span></span><button class="{{darkCls}}" role="switch" aria-checked="{{darkOn}}" aria-label="Dark mode" onClick="{{toggleDark}}"><i></i></button></div>
<a class="actrow" href="Privacy.dc.html" style="text-decoration: none"><span class="tile c-blue"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg></span><span class="col grow"><span class="ts">Privacy &amp; visibility</span><span class="cap">Who sees your avatar, phone and email</span></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #4B5563"><path d="m9 18 6-6-6-6"></path></svg></a>
<a class="actrow danger" href="Logout.dc.html" style="text-decoration: none"><span class="tile c-danger"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5M21 12H9"></path></svg></span><span class="col grow"><span class="ts" style="color: #B3261E">Log out</span><span class="cap">You can sign back in any time</span></span></a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); let d = false; try { d = localStorage.getItem('nexus-theme') === 'dark'; } catch (e) {} this.state = { p: 0, darkPref: d }; }
  componentDidMount() { this.t = setInterval(() => { if (this.state.p >= 1) return clearInterval(this.t); this.setState({ p: Math.min(1, this.state.p + 0.08) }); }, 40); }
  componentWillUnmount() { clearInterval(this.t); }
  nxSwitch(d, ev, after) {
    const apply = () => {
      try { localStorage.setItem('nexus-theme', d ? 'dark' : 'light'); } catch (e) {}
      document.querySelectorAll('.phone').forEach((p) => p.classList.toggle('dark', d));
      after();
      try { const w = window.parent; if (w && w !== window && typeof w.nexusApplyTheme === 'function') { w.nexusApplyTheme(); w.document.querySelectorAll('iframe').forEach((f) => { try { if (f.contentWindow !== window) f.contentDocument.querySelectorAll('.phone').forEach((p) => p.classList.toggle('dark', d)); } catch (e) {} }); } } catch (e) {}
    };
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const el = ev && ev.currentTarget && ev.currentTarget.getBoundingClientRect ? ev.currentTarget : null;
    const r0 = el ? el.getBoundingClientRect() : null;
    const x = r0 ? r0.left + r0.width / 2 : window.innerWidth - 40, y = r0 ? r0.top + r0.height / 2 : 80;
    if (document.startViewTransition && !reduce) {
      const R = Math.hypot(Math.max(x, window.innerWidth - x), Math.max(y, window.innerHeight - y));
      const vt = document.startViewTransition(apply);
      vt.ready.then(() => document.documentElement.animate({ clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + R + 'px at ' + x + 'px ' + y + 'px)'] }, { duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)', pseudoElement: '::view-transition-new(root)' })).catch(() => {});
    } else {
      document.querySelectorAll('.phone').forEach((p) => p.classList.add('theming'));
      apply();
      setTimeout(() => document.querySelectorAll('.phone').forEach((p) => p.classList.remove('theming')), 700);
    }
  }
  renderVals() {
    const fmt = (v) => v >= 1000000 ? (v / 1000000).toFixed(1) + 'M' : v >= 10000 ? Math.round(v / 1000) + 'k' : v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v));
    const e = 1 - Math.pow(1 - this.state.p, 3);
    const S = [['Friends', 128], ['Followers', 1840], ['Following', 312], ['Posts', 46]];
    return {
      motion: ((this.props.motion ?? true) ? '' : 'still') + ((this.props.dark || this.state.darkPref) ? ' dark' : ''),
      darkCls: (this.props.dark || this.state.darkPref) ? 'toggle on' : 'toggle',
      darkOn: (this.props.dark || this.state.darkPref) ? 'true' : 'false',
      toggleDark: (e) => { const v = !this.state.darkPref; this.nxSwitch(v, e, () => this.setState({ darkPref: v })); },
      stats: S.map(([l, v]) => ({ l, v: fmt(v * e) }))
    };
  }
}
</script>
</body>
</html>

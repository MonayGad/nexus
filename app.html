<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nexus</title>
<meta name="theme-color" content="#EEF0F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nexus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#EEF0F5;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#1B1D22;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:48px}
#device{position:relative;flex-shrink:0;overflow:hidden;background:#EEF0F5}
#device iframe{position:absolute;top:0;left:0;will-change:translate,opacity;width:390px;border:0;transform-origin:0 0;background:#EEF0F5}
#splash{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#EEF0F5;transition:opacity .5s ease,visibility .5s ease}
#splash.hide{opacity:0;visibility:hidden}
#splash .logo{width:92px;height:92px;border-radius:28px;background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;box-shadow:0 16px 36px rgba(122,20,38,.2);animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both}
#splash span{font-weight:800;font-size:20px;letter-spacing:-.02em;animation:fade .8s .2s both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* desktop: phone frame + side panel */
body.desk{background:radial-gradient(circle at 80% 10%,rgba(122,20,38,.25),transparent 40%),radial-gradient(circle at 10% 80%,rgba(91,141,239,.25),transparent 45%),#EEF0F5}
body.desk #device{border-radius:46px;border:10px solid #1B1D22;box-shadow:0 40px 80px rgba(27,29,34,.25)}
#side{display:none;max-width:300px;flex-direction:column;gap:14px}
body.desk #side{display:flex}
#side h1{font-size:40px;letter-spacing:-.03em;line-height:1.05;margin:0}
#side h1 em{font-style:normal;color:#7A1426}
#side p{margin:0;color:#4B5563;line-height:1.6;font-size:15px}
#side a,#side button{display:inline-flex;align-items:center;justify-content:center;height:48px;border-radius:16px;font:inherit;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;border:none}
#side .primary{background:#7A1426;color:#fff;box-shadow:0 10px 24px rgba(122,20,38,.3)}
#side .soft{background:rgba(255,255,255,.75);color:#1B1D22;border:1px solid #fff}
html.dark body{background:#120A10;color:#F4EEF1}
html.dark p.lead,html.dark footer,html.dark #side p{color:#A89EAB}
html.dark nav{background:rgba(18,10,16,.75);border-color:rgba(255,255,255,.08)}
html.dark nav a{background:rgba(255,255,255,.08);color:#F4EEF1}
html.dark h1 em,html.dark #side h1 em{color:#F08AA0}
html.dark #themeBtn{background:rgba(255,255,255,.08)!important;border-color:rgba(255,255,255,.14)!important}
html.dark body.desk{background:radial-gradient(circle at 80% 10%,rgba(184,48,74,.35),transparent 40%),radial-gradient(circle at 10% 80%,rgba(110,91,239,.25),transparent 45%),#120A10}
html.dark #splash{background:#120A10}html.dark #splash span{color:#F4EEF1}
html.dark #side .soft{background:rgba(255,255,255,.08);color:#F4EEF1;border-color:rgba(255,255,255,.14)}
html.dark .blob{opacity:.25}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="logo"><img src="logo-mark.png" alt="" style="width:58px;height:58px;object-fit:contain"></div><span>Nexus</span></div>
<div id="stage">
<div id="device"><iframe id="app" title="Nexus app" src="Login.dc.html"></iframe></div>
<aside id="side">
<h1>Nexus,<br><em>redesigned.</em></h1>
<p>A live prototype of the student app. Click through it like the real thing: sign in, open a workspace, submit a task, chat.</p>
<button class="primary" id="restart">Restart from login</button>
<button class="soft" id="themeBtn" type="button" aria-label="Toggle dark mode">Dark mode</button>
<a class="soft" href="index.html">See all 45 screens</a>
<p style="font-size:13px">On your phone, open this link and choose “Add to Home Screen” to use it like an app.</p>
</aside>
</div>
<script>
/* Nexus app shell: two stacked frames so every screen change is seamless (no blank flash). */
const W = 390, H = 844;
const device = document.getElementById('device');
let cur = document.getElementById('app'), S = 1, busy = false;
const frames = () => device.querySelectorAll('iframe');
const getDark = () => { try { return localStorage.getItem('nexus-theme') === 'dark'; } catch (e) { return false; } };
function sizeFrame(f) {
  const vw = window.innerWidth, vh = window.innerHeight;
  f.style.height = (document.body.classList.contains('desk') ? H : vh / S) + 'px';
  f.style.transform = 'scale(' + S + ')';
  f.style.background = getDark() ? '#120A10' : '#EEF0F5';
}
function fit() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const desk = vw >= 760;
  document.body.classList.toggle('desk', desk);
  if (desk) { S = Math.min(1, (vh - 60) / H); device.style.width = W * S + 'px'; device.style.height = H * S + 'px'; }
  else { S = vw / W; device.style.width = vw + 'px'; device.style.height = vh + 'px'; }
  frames().forEach(sizeFrame);
}
window.addEventListener('resize', fit); fit();
let shown = false;
const hideSplash = () => { if (!shown) { shown = true; setTimeout(() => document.getElementById('splash').classList.add('hide'), 700); } };
cur.addEventListener('load', hideSplash, { once: true }); setTimeout(hideSplash, 4000);

window.nexusApplyTheme = function () {
  const d = getDark(), b = document.getElementById('themeBtn');
  document.documentElement.classList.toggle('dark', d);
  if (b) b.textContent = d ? 'Light mode' : 'Dark mode';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = d ? '#120A10' : '#EEF0F5';
  device.style.background = d ? '#120A10' : '#EEF0F5';
  frames().forEach((f) => { f.style.background = d ? '#120A10' : '#EEF0F5'; });
};
nexusApplyTheme();

const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const IOS = 'cubic-bezier(.32,.72,0,1)';
function ready(f) {
  return new Promise((res) => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      let doc = null; try { doc = f.contentDocument; } catch (e) {}
      const ok = doc && doc.readyState !== 'loading' && doc.location.href !== 'about:blank' && doc.querySelector('.phone');
      if (ok || Date.now() - t0 > 3000) { clearInterval(iv); setTimeout(res, ok ? 90 : 0); }
    }, 30);
  });
}
function hook(f) {
  let doc; try { doc = f.contentDocument; } catch (e) { return; }
  if (!doc || doc.__nx) return; doc.__nx = true;
  doc.addEventListener('click', (e) => {
    if (e.defaultPrevented || e.button > 0 || e.metaKey || e.ctrlKey) return;
    const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
    const h = a.getAttribute('href') || '';
    if (!/\.dc\.html(\?|#|$)/.test(h) || a.target === '_blank') return;
    e.preventDefault(); e.stopPropagation();
    if (a.closest('.nav') && a.classList.contains('on')) return;
    const lbl = (a.getAttribute('aria-label') || '') + ' ' + (a.textContent || '');
    const kind = a.closest('.nav') ? 'tab' : (/\bback\b|cancel|close/i.test(lbl) ? 'back' : 'push');
    go(a.href, kind);
  }, true);
}
async function go(url, kind) {
  if (busy) return; busy = true;
  const old = cur, nf = document.createElement('iframe');
  nf.title = 'Nexus app'; nf.className = 'nx-frame';
  sizeFrame(nf);
  nf.style.opacity = '0';
  if (kind === 'back') device.insertBefore(nf, old); else device.appendChild(nf);
  nf.addEventListener('load', () => hook(nf));
  nf.src = url;
  await ready(nf); hook(nf);
  const Wd = device.clientWidth, dur = reduce ? 0 : (kind === 'tab' ? 260 : 480);
  const o = { duration: dur, easing: kind === 'tab' ? 'ease-out' : IOS, fill: 'forwards' };
  let anims = [];
  nf.style.opacity = '1';
  if (kind === 'push') {
    nf.style.boxShadow = '-12px 0 40px rgba(27,29,34,.18)';
    anims = [nf.animate({ translate: [Wd + 'px 0', '0 0'] }, o), old.animate({ translate: ['0 0', -Wd * .28 + 'px 0'], filter: ['brightness(1)', 'brightness(.82)'] }, o)];
  } else if (kind === 'back') {
    old.style.boxShadow = '-12px 0 40px rgba(27,29,34,.18)';
    anims = [nf.animate({ translate: [-Wd * .28 + 'px 0', '0 0'], filter: ['brightness(.82)', 'brightness(1)'] }, o), old.animate({ translate: ['0 0', Wd + 'px 0'] }, o)];
  } else {
    anims = [nf.animate({ opacity: [0, 1] }, o)];
  }
  await Promise.all(anims.map((x) => x.finished.catch(() => {})));
  old.remove();
  anims.forEach((x) => { try { x.cancel(); } catch (e) {} });
  nf.style.boxShadow = ''; nf.id = 'app';
  cur = nf; busy = false;
}
cur.addEventListener('load', () => hook(cur)); hook(cur);
document.getElementById('restart').addEventListener('click', () => go(new URL('Login.dc.html', location.href).href, 'back'));
const tb = document.getElementById('themeBtn');
if (tb) tb.addEventListener('click', () => {
  try { localStorage.setItem('nexus-theme', getDark() ? 'light' : 'dark'); } catch (e) {}
  nexusApplyTheme();
  try { const w = cur.contentWindow; if (/Profile|Home|Login/.test(w.location.pathname)) w.location.reload(); else w.document.querySelectorAll('.phone').forEach((p) => p.classList.toggle('dark', getDark())); } catch (e) {}
});
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add member</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
.pick{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);cursor:pointer;width:100%;font:inherit;text-align:left;transition:border-color .2s ease}
.pick.on{border:2px solid #7A1426;background:#FFFFFF}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #D6DEE6;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pick.on .radio{border-color:#7A1426}
.pick.on .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:#7A1426}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 844px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page" aria-hidden="true"><h1 class="display">Members</h1><div class="glass" style="height: 70px; border-radius: 22px"></div><div class="glass" style="height: 70px; border-radius: 22px"></div></div>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-label="Add member">
<div class="handle" aria-hidden="true"></div>
<div class="row"><h2 class="h1 grow">Add member</h2><a class="ib" href="Members.dc.html" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div>
<sc-if value="{{added}}" hint-placeholder-val="{{ false }}"><div class="status pop" style="background: #E3F1EA; color: #2F6B4F"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>{{addedName}} added.</div></sc-if>
<div class="field">
<label class="over" for="mem">Email</label>
<div class="{{inCls}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m3 7 9 6 9-6"></path></svg><input id="mem" type="email" placeholder="name@university.edu" value="{{email}}" onChange="{{onEmail}}"></div>
<sc-if value="{{hasErr}}" hint-placeholder-val="{{ false }}"><span class="err-t">{{err}}</span></sc-if>
</div>
<sc-if value="{{choosing}}" hint-placeholder-val="{{ true }}">
<div class="col gap8 pop">
<span class="ts">Confirm member</span>
<span class="small">2 users match “{{email}}”. Select the person to add:</span>
<sc-for list="{{cands}}" as="c" hint-placeholder-count="2">
<button class="{{c.cls}}" onClick="{{c.pick}}" role="radio" aria-checked="{{c.sel}}"><span class="radio" aria-hidden="true"></span><span class="{{c.av}}">{{c.i}}</span><span class="col grow"><span class="ts">{{c.name}}</span><span class="cap">{{c.meta}}</span></span></button>
</sc-for>
</div>
</sc-if>
<button class="btn btn-primary btn-block" onClick="{{onAdd}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c1-4 3.5-6 7-6s6 2 7 6"></path><path d="M19 8v6M16 11h6"></path></svg>{{cta}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { email: 'laila.h@university.edu', err: '', choosing: true, sel: 1, added: '' }; }
  renderVals() {
    const C = [{ id: 1, i: 'LH', tone: 'c-coral', name: 'Laila Hassan', meta: '@laila.h · Student' }, { id: 2, i: 'LH', tone: 'c-blue', name: 'Laila Hamdy', meta: '@lhamdy · Student' }];
    const choosing = this.state.choosing;
    const re = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
    return {
      motion: (this.props.motion ?? true) ? '' : 'still',
      email: this.state.email,
      inCls: this.state.err ? 'input err' : 'input focus',
      hasErr: !!this.state.err,
      err: this.state.err,
      choosing: choosing,
      added: !!this.state.added,
      addedName: this.state.added,
      cta: choosing ? 'Add selected member' : 'Add',
      cands: C.map((c) => ({ ...c, av: 'av ' + c.tone, sel: this.state.sel === c.id ? 'true' : 'false', cls: this.state.sel === c.id ? 'pick on' : 'pick', pick: () => this.setState({ sel: c.id }) })),
      onEmail: (e) => this.setState({ email: e.target.value, err: '', choosing: false, added: '' }),
      onAdd: () => {
        const e = this.state.email.trim();
        if (choosing) { const c = C.find((x) => x.id === this.state.sel); this.setState({ choosing: false, added: c.name, email: '' }); return; }
        if (!e) return this.setState({ err: 'Email address is required.' });
        if (!re.test(e)) return this.setState({ err: 'Please enter a valid email address.' });
        if (e.startsWith('nobody')) return this.setState({ err: 'No user found with that email address.' });
        this.setState({ choosing: true, sel: 1 });
      }
    };
  }
}
</script>
</body>
</html>

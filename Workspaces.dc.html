<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workspaces</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 980px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page">
<div class="row rise">
<div class="col grow"><h1 class="display">Workspaces</h1><span class="small">5 active · 2 archived</span></div>
<button class="ib" aria-label="Notifications"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span class="badge-dot" aria-hidden="true"></span></button>
</div>

<div class="row rise d2" style="gap: 10px">
<a class="glass row grow" href="WorkspaceSearch.dc.html" style="height: 50px; border-radius: 18px; padding: 0 16px; gap: 10px; text-decoration: none; color: #4B5563"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span class="small">Search by name or instructor</span></a>
<a class="ib" href="JoinWorkspace.dc.html" aria-label="Join workspace with a code"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="m10 17 5-5-5-5M15 12H3"></path></svg></a>
<a class="ib ib-brand" href="CreateWorkspace.dc.html" aria-label="Create workspace"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>

<div class="tabs rise d3" role="tablist" aria-label="Workspace status">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button role="tab" aria-selected="{{t.sel}}" class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}<span class="n">{{t.n}}</span></button></sc-for>
</div>

<div class="col gap10">
<sc-for list="{{list}}" as="w" hint-placeholder-count="5">
<a class="glass lift row rise" href="WorkspaceOverview.dc.html" style="border-radius: 24px; padding: 14px; gap: 14px; text-decoration: none; color: #1B1D22; animation-delay: {{w.delay}}">
<span class="tile tile-xl" style="background: {{w.tone}}; color: #FFFFFF; border-radius: 20px; width: 60px; height: 60px"><span style="font-size: 18px; font-weight: 800">{{w.code}}</span></span>
<span class="col grow gap4"><span class="t">{{w.title}}</span><span class="cap">{{w.dept}}</span><span class="row gap8"><span class="{{w.chip}}">{{w.badge}}</span><span class="row gap4 cap"><svg class="ic s14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c1-4 3.5-6 7-6s6 2 7 6"></path></svg>{{w.n}} students</span></span></span>
<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: #4B5563"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</sc-for>
</div>
</div>

<nav class="nav" aria-label="Main">
<a href="Home.dc.html" aria-label="Home"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path></svg></a>
<a class="on" href="Workspaces.dc.html"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 10 5-10 5L2 7z"></path><path d="m2 12 10 5 10-5"></path><path d="m2 17 10 5 10-5"></path></svg>Workspaces</a>
<a href="Chats.dc.html" aria-label="Chats, unread messages"><svg class="ic s24" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"></path></svg><span class="dot" aria-hidden="true"></span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'active' }; }
  renderVals() {
    const tab = this.state.tab;
    const active = [
      { code: 'ML', title: 'Machine Learning', dept: 'Computer Science', badge: 'Core', chip: 'chip c-pink', tone: '#E0466A', n: 48 },
      { code: 'DS', title: 'Data Science Lab', dept: 'AID 427', badge: 'Lab', chip: 'chip c-blue', tone: '#5B8DEF', n: 36 },
      { code: 'UX', title: 'Design Studio', dept: 'Fine Arts', badge: 'Studio', chip: 'chip c-coral', tone: '#FF7A59', n: 22 },
      { code: 'BD', title: 'Big Data Systems', dept: 'Information Systems', badge: 'Elective', chip: 'chip c-amber', tone: '#F2A93B', n: 61 },
      { code: 'C+', title: 'Algorithms & C++', dept: 'Computer Science', badge: 'Core', chip: 'chip c-maroon', tone: '#4F6D8F', n: 54 }
    ];
    const archived = [
      { code: 'RG', title: 'Regression Analysis', dept: 'Statistics · Spring', badge: 'Archived', chip: 'chip c-neutral', tone: '#4F6D8F', n: 40 },
      { code: 'DM', title: 'Data Mining', dept: 'Computer Science · Fall', badge: 'Archived', chip: 'chip c-neutral', tone: '#A3283D', n: 33 }
    ];
    const list = (tab === 'active' ? active : archived).map((w, i) => ({ ...w, delay: (0.2 + i * 0.06).toFixed(2) + 's' }));
    return {
      motion: ((this.props.motion ?? true) ? '' : 'still') + (this.props.dark || (() => { try { return localStorage.getItem('nexus-theme') === 'dark'; } catch (e) { return false; } })() ? ' dark' : ''),
      tabs: [['active', 'Active', 5], ['archived', 'Archived', 2]].map(([id, label, n]) => ({ label, n, sel: tab === id ? 'true' : 'false', cls: tab === id ? 'tab on' : 'tab', pick: () => this.setState({ tab: id }) })),
      list: list
    };
  }
}
</script>
</body>
</html>

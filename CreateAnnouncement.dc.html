<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create announcement</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nexus.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A1426}a:hover{color:#4A0D18}
</style>
</helmet>
<div class="phone {{motion}}" style="height: 900px">
<div class="blobs" aria-hidden="true"><div class="blob bl1"></div><div class="blob bl2"></div><div class="blob bl3"></div><div class="blob bl4"></div></div>
<div class="page" aria-hidden="true"><div class="hero" style="height: 200px"></div></div>
<div class="scrim"></div>
<div class="sheet" role="dialog" aria-label="Create announcement">
<div class="handle" aria-hidden="true"></div>
<div class="row"><div class="col grow gap4"><h2 class="h1">Create announcement</h2><span class="chip c-maroon" style="align-self: flex-start"><svg class="ic s14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="m9 12 2 2 4-4"></path></svg>Admin/Moderator access only</span></div><a class="ib" href="Announcements.dc.html" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div>
<sc-if value="{{posted}}" hint-placeholder-val="{{ false }}"><div class="status pop" style="background: #E3F1EA; color: #2F6B4F"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg>Announcement posted.</div></sc-if>
<div class="field"><label class="over" for="at">Title</label><div class="{{tCls}}"><input id="at" placeholder="Enter title..." value="{{title}}" onChange="{{onTitle}}"></div><sc-if value="{{tErr}}" hint-placeholder-val="{{ false }}"><span class="err-t">Add a title for your announcement.</span></sc-if></div>
<div class="field"><label class="over" for="ab">Content</label><textarea id="ab" class="area" placeholder="Write your announcement..." style="min-height: 110px">Quiz 2 covers modules 3 and 4. It opens Friday at 9 AM and closes Sunday night.</textarea></div>
<div class="field">
<span class="over">Attachments</span>
<button class="dash row" onClick="{{addFile}}" style="padding: 14px; gap: 12px; cursor: pointer; font: inherit; width: 100%; text-align: left"><span class="tile bg-soft"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"></path></svg></span><span class="col grow"><span class="ts" style="color: #7A1426">Add attachment</span><span class="cap">PDF, images, and documents up to 50MB.</span></span></button>
<sc-for list="{{files}}" as="f" hint-placeholder-count="1"><div class="file pop"><span class="tile bg-coral" style="width: 38px; height: 38px; border-radius: 12px"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg></span><span class="col grow"><span class="ts">{{f.name}}</span><span class="cap">New • {{f.size}}</span></span><button class="ib ib-sm" aria-label="Remove file" onClick="{{f.remove}}" style="background: #FBE1E7; border: none; color: #B3261E"><svg class="ic s16" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div></sc-for>
</div>
<button class="btn btn-primary btn-block" onClick="{{onPost}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"></path><path d="M15 9a4 4 0 0 1 0 6"></path></svg>Post announcement</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { title: 'Quiz 2 schedule', files: [{ id: 1, name: 'quiz2_topics.pdf', size: '310 KB' }], tried: false, posted: false }; }
  renderVals() {
    const ok = this.state.title.trim().length > 0;
    const err = this.state.tried && !ok;
    return {
      motion: (this.props.motion ?? true) ? '' : 'still',
      title: this.state.title,
      tCls: err ? 'input err' : 'input focus',
      tErr: err,
      posted: this.state.posted,
      files: this.state.files.map((f) => ({ ...f, remove: () => this.setState({ files: this.state.files.filter((x) => x.id !== f.id) }) })),
      onTitle: (e) => this.setState({ title: e.target.value, posted: false }),
      addFile: () => this.setState({ files: this.state.files.concat([{ id: Date.now(), name: 'seating_plan.png', size: '1.4 MB' }]) }),
      onPost: () => this.setState({ tried: true, posted: ok })
    };
  }
}
</script>
</body>
</html>
